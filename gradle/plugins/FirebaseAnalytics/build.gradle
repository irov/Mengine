apply from: rootProject.projectDir.getAbsolutePath() + '/plugins/plugin.gradle'
apply from: rootProject.projectDir.getAbsolutePath() + '/gms.gradle'

android {
    namespace = "org.Mengine.Plugin.FirebaseAnalytics"

    buildTypes {
        debug {
            manifestPlaceholders.mengineFirebaseAnalyticsCollectionDeactivated = true
        }

        release {
            manifestPlaceholders.mengineFirebaseAnalyticsCollectionDeactivated = false
        }
    }
}

dependencies {
    implementation project(':plugins:Firebase')
    
    implementation 'com.google.firebase:firebase-analytics:24.0.0'
}
